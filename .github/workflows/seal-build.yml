name: seal-build

# Authored by agentic-sealer: Apache POI 3.15 has no GitHub Actions CI upstream
# (it was built with Ant on Jenkins/Gump). This mirrors the release toolchain
# (JDK 1.6 + Ant 1.9.4, per the published jar's MANIFEST) and the project's own
# `ant jar` / `ant test` targets from build.xml.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional Ant testpattern (e.g. TestIOUtils); empty runs the full suite"
        required: false
        default: ""

env:
  ZULU6_URL: https://cdn.azul.com/zulu/bin/zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz
  ANT_URL: https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.tar.gz
  M2: https://repo1.maven.org/maven2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        task: [jar, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 6 (Zulu) and Ant 1.9.4
        run: |
          mkdir -p "$HOME/tools"
          curl -sSfL "$ZULU6_URL" | tar -xz -C "$HOME/tools"
          curl -sSfL "$ANT_URL" | tar -xz -C "$HOME/tools"
          echo "JDK6_HOME=$(ls -d $HOME/tools/zulu6*)" >> "$GITHUB_ENV"
          echo "ANT_HOME=$HOME/tools/apache-ant-1.9.4" >> "$GITHUB_ENV"
          # build.xml's <scriptdef language="javascript"> needs a JS engine.
          # The release's Oracle JDK 6 bundled Rhino; OpenJDK/Zulu 6 does not,
          # so give Ant the BSF + Rhino engine (Ant's "auto" manager picks BSF).
          for j in bsf/bsf/2.4.0/bsf-2.4.0.jar rhino/js/1.7R2/js-1.7R2.jar commons-logging/commons-logging/1.2/commons-logging-1.2.jar; do
            curl -sSfL -o "$HOME/tools/apache-ant-1.9.4/lib/$(basename $j)" "$M2/$j"
          done

      # JDK 6 cannot negotiate TLS 1.2 with Maven Central, so the project's own
      # fetch-jars / fetch-ooxml-jars targets run once under the runner's JDK 8.
      - name: Fetch third-party jars (ant fetch-jars fetch-ooxml-jars, JDK 8)
        run: |
          export JAVA_HOME="$JAVA_HOME_8_X64"
          "$ANT_HOME/bin/ant" -noinput fetch-jars fetch-ooxml-jars
          # The ECMA-376 schema zips (ooxml.xsds.url.*) are gone from
          # ecma-international.org (404); use the XMLBeans-compiled schema jars
          # POI itself published for this release line.
          curl -sSfL -o ooxml-lib/ooxml-schemas-1.3.jar          "$M2/org/apache/poi/ooxml-schemas/1.3/ooxml-schemas-1.3.jar"
          curl -sSfL -o ooxml-lib/ooxml-schemas-1.3-sources.jar  "$M2/org/apache/poi/ooxml-schemas/1.3/ooxml-schemas-1.3-sources.jar"
          curl -sSfL -o ooxml-lib/ooxml-security-1.1.jar         "$M2/org/apache/poi/ooxml-security/1.1/ooxml-security-1.1.jar"
          curl -sSfL -o ooxml-lib/ooxml-security-1.1-sources.jar "$M2/org/apache/poi/ooxml-security/1.1/ooxml-security-1.1-sources.jar"
          ls -l lib ooxml-lib compile-lib

      - name: Build jars (ant jar, JDK 6)
        if: matrix.task == 'jar'
        run: |
          export JAVA_HOME="$JDK6_HOME" PATH="$JDK6_HOME/bin:$PATH"
          java -version
          "$ANT_HOME/bin/ant" -noinput -Ddisconnected=true jar
          ls -l build/dist/maven/*/

      - name: Run tests (ant test, JDK 6)
        if: matrix.task == 'test'
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          export JAVA_HOME="$JDK6_HOME" PATH="$JDK6_HOME/bin:$PATH"
          java -version
          EXTRA=""
          if [ -n "$TEST_FILTER" ]; then EXTRA="-Dtestpattern=$TEST_FILTER"; fi
          # halt.on.test.failure=false so every suite (main, scratchpad, ooxml,
          # excelant) runs to completion; the next step fails the job on ANY
          # failure or error found in the JUnit XML reports.
          "$ANT_HOME/bin/ant" -noinput -Ddisconnected=true -Dhalt.on.test.failure=false $EXTRA test

      - name: Test summary (fails the job on any failure/error)
        if: matrix.task == 'test' && always()
        run: python3 -I .github/seal-test-summary.py

      - name: Upload poi jar
        if: matrix.task == 'jar'
        uses: actions/upload-artifact@v4
        with:
          name: poi-jar
          path: build/dist/maven/poi/poi-3.15.jar
          if-no-files-found: error
